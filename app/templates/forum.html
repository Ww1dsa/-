{% extends 'base.html' %}
{% block content %}
<section class="card">
    <h1>交流论坛</h1>
    <form method="post" action="/forum" class="forum-form">
        <div class="grid two">
            <div>
                <label>作者</label>
                <input type="text" name="author" placeholder="匿名用户" />
            </div>
            <div>
                <label>标题</label>
                <input type="text" name="title" maxlength="150" required />
            </div>
        </div>

        <label>内容</label>
        <textarea name="content" rows="5" maxlength="5000" required></textarea>
        <button type="submit">发布帖子</button>
    </form>
</section>

<section class="card mt">
    <h2>帖子列表</h2>
    {% if posts %}
        {% for post in posts %}
        <article class="post">
            <h3>{{ post.title }}</h3>
            <p class="meta">{{ post.author }} · {{ post.created_at }}</p>
            <p>{{ post.content }}</p>
        </article>
        {% endfor %}
    {% else %}
        <p>还没有帖子，快来发布第一条。</p>
    {% endif %}
</section>
{% endblock %}
